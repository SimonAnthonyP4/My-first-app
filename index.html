<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Terramania</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="game" width="384" height="224"></canvas>
  <div id="help">
    <span><b>P1</b> A/D move · W jump · S crouch · F light · G heavy · H block · T throw</span>
    <span><b>P2</b> ←/→ move · ↑ jump · ↓ crouch · Num1 (or ,) light · Num2 (or .) heavy · Num3 (or /) block · Num4 (or L) throw</span>
    <span>Menus: W/S or ↑/↓ + Enter · Esc pause/back · M mute · ` hitboxes</span>
  </div>

  <!-- Plain scripts (no modules) so the game runs straight from the file system. Order matters. -->
  <script src="js/core/namespace.js"></script>
  <script src="js/core/util.js"></script>

  <script src="js/core/settings.js"></script>

  <script src="js/render/poses.js"></script>

  <script src="js/render/pixel-puppet-sprite.js"></script>
  <script src="js/render/sprites.js"></script>
  <script src="js/render/electric.js"></script>
  <script src="js/render/fire.js"></script>

  <script src="js/stages/registry.js"></script>
  <script src="js/stages/cafeteria.js"></script>
  <script src="js/stages/nyc-street.js"></script>
  <script src="js/stages/haunted-court.js"></script>
