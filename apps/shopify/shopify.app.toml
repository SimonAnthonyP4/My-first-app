# Shopify app configuration for Bro Batch Rewards.
#
# NOT YET CONNECTED TO A SHOPIFY APP. The two placeholders below are filled
# in once the app exists in the Shopify Dev Dashboard and the Supabase project
# exists. See docs/RUNBOOK.md, "Connect Shopify". The deploy refuses to run
# while a placeholder remains (scripts/deploy-preflight.mjs).
#
# Nothing in this file is secret: the client ID is public. The client secret
# is never stored in the repository; it is set as an Edge Function secret.

name = "Bro Batch Rewards"
client_id = "REPLACE_WITH_SHOPIFY_CLIENT_ID"
# The app has no screens in Shopify admin (its only screen is the POS tile),
# so this is Shopify's stock page for apps without one.
application_url = "https://shopify.dev/apps/default-app-home"
embedded = false

[auth]
# Required by Shopify CLI. Not used: the backend gets its API access with the
# client credentials grant, which has no redirect.
redirect_urls = ["https://shopify.dev/apps/default-app-home/api/auth"]

[access_scopes]
# read_orders:      receive orders/paid and refunds/create webhooks
# read/write_customers: match a rewards member to a Shopify customer, or create one
# read_products:    read a product's price and collection when a reward is applied
# read/write_discounts: create and delete the single-use reward codes
scopes = "read_orders,read_customers,write_customers,read_products,read_discounts,write_discounts"

[webhooks]
api_version = "2026-10"

[[webhooks.subscriptions]]
topics = ["orders/paid", "refunds/create"]
uri = "https://REPLACE_WITH_PROJECT_REF.supabase.co/functions/v1/shopify-webhook"

[pos]
embedded = false
